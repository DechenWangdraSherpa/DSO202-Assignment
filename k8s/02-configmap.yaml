# =============================================================================
# File    : k8s/02-configmap.yaml
# Purpose : All NON-SENSITIVE configuration for the three tiers.
# NOTE    : DB_NAME and POSTGRES_DB are two names for the SAME value, because
#           the backend and the official postgres image use different names.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: dso202-assignment-01
  labels:
    dso202/assignment: "01"
    dso202/managed-by: declarative
data:
  DB_HOST: db-svc                         # name of the database Service
  DB_PORT: "5432"
  DB_NAME: taskdb                         # must equal POSTGRES_DB
  APP_PORT: "8080"
  CORS_ORIGIN: "*"
  POSTGRES_DB: taskdb                     # must equal DB_NAME
  BACKEND_URL: http://backend-svc:8080    # cluster-internal backend address
