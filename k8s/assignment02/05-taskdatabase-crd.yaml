apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: taskdatabases.dso202.example.com
spec:
  group: dso202.example.com
  names:
    kind: TaskDatabase
    plural: taskdatabases
    singular: taskdatabase
    shortNames: [tdb]
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - {name: Version,  type: string,  jsonPath: .spec.postgresVersion}
    - {name: Replicas, type: integer, jsonPath: .spec.replicas}
    - {name: Storage,  type: string,  jsonPath: .spec.storageSize}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              postgresVersion: {type: string}
              replicas: {type: integer}
              storageSize: {type: string}
          status:
            type: object
            properties:
              observedGeneration: {type: integer}
              phase: {type: string}
