apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
    tier: database
    dso202/assignment: "02"
    dso202/managed-by: declarative
spec:
  serviceName: db-svc              # the existing headless Service
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: task-tracker
      tier: database
  template:
    metadata:
      labels:
        app: task-tracker
        tier: database
        dso202/assignment: "02"
        dso202/managed-by: declarative
    spec:
      containers:
      - name: postgres
        image: dwangshers/dso202-amd64-db:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef: { name: app-config, key: POSTGRES_DB }
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef: { name: app-secret, key: POSTGRES_USER }
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: app-secret, key: POSTGRES_PASSWORD }
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
  - metadata:
      name: db-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
