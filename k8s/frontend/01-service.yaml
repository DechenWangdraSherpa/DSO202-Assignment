# =============================================================================
# File    : k8s/frontend/01-service.yaml
# Purpose : NodePort Service. nodePort 30080 must equal the kind cluster's
#           extraPortMappings (Practical 1, Listing 1) to be reachable at
#           http://localhost:30080
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
    tier: frontend
    dso202/assignment: "01"
    dso202/managed-by: declarative
spec:
  type: NodePort
  selector:
    app: task-tracker
    tier: frontend
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 30080
