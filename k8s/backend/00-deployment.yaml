# =============================================================================
# File    : k8s/backend/00-deployment.yaml
# Purpose : REST API. Uses DB_* keys (NOT POSTGRES_*). DB_HOST = db-svc.
#           The app retries the DB connection itself, so no probes are needed.
# IMAGE   : Built unmodified from the tutor's ./backend source for linux/amd64
#           and published on Docker Hub (tutor's image is arm64-only).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
    tier: backend
    dso202/assignment: "01"
    dso202/managed-by: declarative
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-tracker
      tier: backend
  template:
    metadata:
      labels:
        app: task-tracker
        tier: backend
        dso202/assignment: "01"
        dso202/managed-by: declarative
    spec:
      containers:
      - name: api
        image: dwangshers/dso202-amd64-backend:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef: { name: app-config, key: DB_HOST }
        - name: DB_PORT
          valueFrom:
            configMapKeyRef: { name: app-config, key: DB_PORT }
        - name: DB_NAME
          valueFrom:
            configMapKeyRef: { name: app-config, key: DB_NAME }
        - name: APP_PORT
          valueFrom:
            configMapKeyRef: { name: app-config, key: APP_PORT }
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef: { name: app-config, key: CORS_ORIGIN }
        - name: DB_USER
          valueFrom:
            secretKeyRef: { name: app-secret, key: DB_USER }
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: app-secret, key: DB_PASSWORD }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 250m, memory: 256Mi }
