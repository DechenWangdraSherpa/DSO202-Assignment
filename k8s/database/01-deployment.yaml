# =============================================================================
# File    : k8s/database/01-deployment.yaml
# Purpose : Single-replica PostgreSQL. Uses POSTGRES_* keys (NOT DB_*).
# IMAGE   : Built unmodified from the tutor's ./db source for linux/amd64 and
#           published on Docker Hub, because the tutor's published image is
#           arm64-only and this cluster runs on x86_64.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: dso202-assignment-01
  labels:
    app: task-tracker
    tier: database
    dso202/assignment: "01"
    dso202/managed-by: declarative
spec:
  replicas: 1
  # Recreate: a ReadWriteOnce volume must never be used by two database
  # Pods at once, so the old Pod is removed before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: task-tracker
      tier: database
  template:
    metadata:
      labels:
        app: task-tracker
        tier: database
        dso202/assignment: "01"
        dso202/managed-by: declarative
    spec:
      containers:
      - name: postgres
        image: dwangshers/dso202-amd64-db:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef: { name: app-config, key: POSTGRES_DB }
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef: { name: app-secret, key: POSTGRES_USER }
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: { name: app-secret, key: POSTGRES_PASSWORD }
        # Data goes in a sub-directory of the mount so the volume's root
        # directory never confuses initdb, and the data really lands on the PVC.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { cpu: 500m, memory: 512Mi }
      volumes:
      - name: db-data
        persistentVolumeClaim:
          claimName: db-pvc
