apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

namespace: a3-kustomize-prod

labels:
  - pairs:
      dso202/environment: prod
    includeSelectors: false
    includeTemplates: true

replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 2

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - BACKEND_URL=http://localhost:8082

patches:
  - path: patch-resources.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: frontend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ENV_NAME
          value: prod
