apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "task-tracker.labels" (dict "root" . "tier" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "task-tracker.selectorLabels" (dict "tier" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-tracker.labels" (dict "root" . "tier" "frontend") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.registry }}/dso202-amd64-frontend:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BACKEND_URL
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  labels:
    {{- include "task-tracker.labels" (dict "root" . "tier" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "task-tracker.selectorLabels" (dict "tier" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
