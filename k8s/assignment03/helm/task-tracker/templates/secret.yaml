apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    {{- include "task-tracker.labels" (dict "root" . "tier" "config") | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.credentials.dbUser | quote }}
  DB_PASSWORD: {{ .Values.credentials.dbPassword | quote }}
  POSTGRES_USER: {{ .Values.credentials.dbUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.dbPassword | quote }}
